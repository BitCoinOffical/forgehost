basePath: /api/v1
definitions:
  dto.CreateCommentDTO:
    properties:
      body:
        type: string
      parent_id:
        type: string
    type: object
  dto.CreatePostDTO:
    properties:
      description:
        type: string
      image_url:
        type: string
      topic_id:
        type: integer
    type: object
  dto.PostDTO:
    properties:
      id:
        type: string
    type: object
  dto.ReportCommentDTO:
    properties:
      cause:
        type: string
    type: object
  dto.ReportDTO:
    properties:
      cause:
        type: string
    type: object
  dto.UpdateCommentDTO:
    properties:
      body:
        type: string
    type: object
  dto.UpdatePostDTO:
    properties:
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      topic_id:
        type: integer
    type: object
  dto.UpdateProfileDTO:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  dto.UserProfileDTO:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  response.ErrorBody:
    properties:
      error:
        type: string
    type: object
host: localhost:8084
info:
  contact: {}
  description: API service for a social networking service
  termsOfService: http://swagger.io/terms/
  title: Social Service API
  version: "1.0"
paths:
  /social/posts:
    get:
      consumes:
      - application/json
      description: Возвращает посты авторов, на которых подписан текущий пользователь
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Лента постов по подпискам
      tags:
      - posts
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные поста
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Создать пост
      tags:
      - posts
  /social/posts/{post_id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID поста
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Удалить пост
      tags:
      - posts
    get:
      consumes:
      - application/json
      parameters:
      - description: ID поста
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostDTO'
        "404":
