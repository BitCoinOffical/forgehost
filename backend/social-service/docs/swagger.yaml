basePath: /api/v1
definitions:
  dto.CreateChatDTO:
    properties:
      description:
        maxLength: 4096
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.CreateCommentDTO:
    properties:
      body:
        maxLength: 2000
        minLength: 1
        type: string
      parent_id:
        type: string
    required:
    - body
    type: object
  dto.CreatePostDTO:
    properties:
      description:
        maxLength: 8192
        type: string
      image_id:
        type: string
      topic_id:
        type: integer
    type: object
  dto.CreateTopicDTO:
    properties:
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.MemberRole:
    enum:
    - member
    - moderator
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleModerator
  dto.MessageDTO:
    properties:
      text:
        maxLength: 4096
        minLength: 1
        type: string
    required:
    - text
    type: object
  dto.PostDTO:
    properties:
      id:
        type: string
    type: object
  dto.ReportCommentDTO:
    properties:
      cause:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - cause
    type: object
  dto.ReportDTO:
    properties:
      cause:
        maxLength: 1024
        minLength: 1
        type: string
    required:
    - cause
    type: object
  dto.ReportTopicDTO:
    properties:
      cause:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - cause
    type: object
  dto.SetMemberRoleDTO:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/dto.MemberRole'
        enum:
        - member
        - moderator
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  dto.StreamDTO:
    properties:
      concurrentViewers:
        type: integer
      embedUrl:
        type: string
      lifeCycleStatus:
        type: string
      likeCount:
        type: integer
      title:
        maxLength: 100
        minLength: 1
        type: string
      videoId:
        type: string
    required:
    - embedUrl
    - lifeCycleStatus
    - title
    - videoId
    type: object
  dto.UpdateChatDTO:
    properties:
      description:
        maxLength: 4096
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dto.UpdateCommentDTO:
    properties:
      body:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - body
    type: object
  dto.UpdatePostDTO:
    properties:
      description:
        maxLength: 4096
        type: string
      image_id:
        type: string
      topic_id:
        type: integer
    type: object
  dto.UpdateProfileDTO:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      bio:
        maxLength: 4096
        type: string
      username:
        type: string
    type: object
  dto.UpdateStreamDTO:
    properties:
      concurrentViewers:
        type: integer
      embedUrl:
        type: string
      lifeCycleStatus:
        type: string
      likeCount:
        type: integer
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  models.Chat:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      ownerID:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  models.ChatMember:
    properties:
      chatID:
        type: string
      joinedAt:
        type: string
      role:
        $ref: '#/definitions/models.MemberRole'
      userID:
        type: string
    type: object
  models.FeedChatMember:
    properties:
      chatID:
        type: string
      joinedAt:
        type: string
      role:
        $ref: '#/definitions/models.MemberRole'
      userID:
        type: string
      userName:
        type: string
    type: object
  models.FeedDirects:
    properties:
      avatarURL:
        type: string
      createdAt:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
      username:
        type: string
    type: object
  models.FeedPost:
    properties:
      avatarURL:
        type: string
      createdAt:
        type: string
      description:
        type: string
      imageID:
        type: string
      imageURL:
        type: string
      likeCount:
        type: integer
      postID:
        type: string
      topicID:
        type: integer
      topicName:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
      username:
        type: string
      views:
        type: integer
    type: object
  models.FeedStream:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      embed_url:
        type: string
      id:
        type: string
      likes:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
      video_id:
        type: string
      viewers:
        type: integer
    type: object
  models.MemberRole:
    enum:
    - member
    - moderator
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleAdmin
  models.Message:
    properties:
      chatID:
        type: string
      createdAt:
        type: string
      text:
        type: string
      userID:
        type: string
    type: object
  models.Profile:
    properties:
      avatar_id:
        type: string
      avatarUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      isBanned:
        type: boolean
      posts:
        type: integer
      subscribers:
        type: integer
      subscriptions:
        type: integer
      updatedAt:
        type: string
      userID:
        type: string
      userName:
        type: string
    type: object
  models.ProfileResponse:
    properties:
      posts:
        items:
          $ref: '#/definitions/models.FeedPost'
        type: array
      profile:
        $ref: '#/definitions/models.Profile'
    type: object
  models.SearchPost:
    properties:
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      imageID:
        type: string
      user_id:
        type: string
    type: object
  models.SearchResponse:
    properties:
      posts:
        items:
          $ref: '#/definitions/models.SearchPost'
        type: array
      streams:
        items:
          $ref: '#/definitions/models.SearchStream'
        type: array
      users:
        items:
          $ref: '#/definitions/models.SearchUser'
        type: array
    type: object
  models.SearchStream:
    properties:
      id:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  models.SearchUser:
    properties:
      avatar_url:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  models.Stream:
    properties:
      created_at:
        type: string
      embed_url:
        type: string
      id:
        type: string
      likes:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      video_id:
        type: string
      viewers:
        type: integer
    type: object
  models.Subscribes:
    properties:
      targetID:
        type: string
    type: object
  models.Subscriptions:
    properties:
      userID:
        type: string
    type: object
  models.Suggestion:
    properties:
      id:
        type: string
      text:
        type: string
      type:
        type: string
    type: object
  models.Topics:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isDeleted:
        type: boolean
      title:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  response.ErrorBody:
    properties:
      error:
        type: string
    type: object
host: localhost:8084
info:
  contact: {}
  description: API service for a social networking service
  termsOfService: http://swagger.io/terms/
  title: Social Service API
  version: "1.0"
paths:
  /social/chats:
    post:
      consumes:
      - application/json
      description: Создаёт групповой чат, создатель становится его владельцем. Возвращает
        ID созданного чата
      parameters:
      - description: Данные чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateChatDTO'
      produces:
      - application/json
      responses:
        "201":
          description: ID созданного чата
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Создать групповой чат
      tags:
      - chats
  /social/chats/{chat_id}:
    delete:
      consumes:
      - application/json
      description: Удалить чат может только его владелец
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Удалить чат
      tags:
      - chats
    get:
      consumes:
      - application/json
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Chat'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Получить чат по ID
      tags:
      - chats
    patch:
      consumes:
      - application/json
      description: Изменяет название и описание чата. Передаются только изменяемые
        поля. Доступно владельцу и модераторам
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateChatDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Chat'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Обновить чат
      tags:
      - chats
  /social/chats/{chat_id}/bans/{user_id}:
    delete:
      consumes:
      - application/json
      description: Доступно владельцу и модераторам
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: ID разбаниваемого пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Разбанить пользователя в чате
      tags:
      - chats
    get:
      consumes:
      - application/json
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: ID проверяемого пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: true, если пользователь забанен
          schema:
            type: boolean
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Проверить, забанен ли пользователь в чате
      tags:
      - chats
    post:
      consumes:
      - application/json
      description: Исключает пользователя и запрещает ему повторное вступление. Доступно
        владельцу и модераторам. Владельца забанить нельзя
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: ID банимого пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав или цель — владелец
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Забанить пользователя в чате
      tags:
      - chats
  /social/chats/{chat_id}/leave:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Выйти из чата
      tags:
      - chats
  /social/chats/{chat_id}/members:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedChatMember'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Список участников чата
      tags:
      - chats
    post:
      consumes:
      - application/json
      description: Добавляет текущего пользователя в чат. Забаненный в чате пользователь
        вступить не может
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Пользователь забанен в чате
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Пользователь уже в чате
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Вступить в чат
      tags:
      - chats
  /social/chats/{chat_id}/members/{user_id}:
    delete:
      consumes:
      - application/json
      description: Доступно владельцу и модераторам. Владельца исключить нельзя
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: ID исключаемого участника
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав или цель — владелец
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Исключить участника из чата
      tags:
      - chats
  /social/chats/{chat_id}/members/{user_id}/role:
    patch:
      consumes:
      - application/json
      description: Меняет роль участника (member или moderator). Доступно только владельцу
        чата
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: ID участника
        in: path
        name: user_id
        required: true
        type: string
      - description: Новая роль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetMemberRoleDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatMember'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Назначить роль участнику чата
      tags:
      - chats
  /social/chats/{chat_id}/read:
    post:
      consumes:
      - application/json
      description: Запоминает время последнего прочтения чата текущим пользователем
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Отметить чат прочитанным
      tags:
      - chats
  /social/chats/directs/{user_id}:
    post:
      consumes:
      - application/json
      description: Создаёт личный чат с указанным пользователем. Если один из пользователей
        заблокировал другого, чат создать нельзя. Возвращает ID чата
      parameters:
      - description: ID собеседника
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: ID личного чата
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Один из пользователей заблокирован
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Создать личный чат
      tags:
      - chats
  /social/chats/list:
    get:
      consumes:
      - application/json
      description: Возвращает личные чаты текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedDirects'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Список личных чатов
      tags:
      - chats
  /social/message/chat/{chat_id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Message'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: История сообщений чата
      tags:
      - messages
  /social/message/stream/{video_id}:
    get:
      consumes:
      - application/json
      description: Возвращает последние сообщения чата стрима (хранятся 24 часа, не
        более 200)
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
