      consumes:
      - application/json
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Стрим не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Удалить стрим
      tags:
      - streams
    get:
      consumes:
      - application/json
      description: Возвращает стрим текущего пользователя по ID видео
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Stream'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Стрим не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Получить стрим
      tags:
      - streams
    patch:
      consumes:
      - application/json
      description: Изменяет данные стрима текущего пользователя. Передаются только
        изменяемые поля
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStreamDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Stream'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Стрим не найден
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Обновить стрим
      tags:
      - streams
  /social/streams/{video_id}/join:
    post:
      consumes:
      - application/json
      description: Добавляет текущего пользователя в список зрителей стрима. Только
        зрители из этого списка могут писать в чат стрима и получать сообщения по
        WebSocket
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Присоединиться к чату стрима
      tags:
      - streams
  /social/streams/list:
    get:
      consumes:
      - application/json
      description: Возвращает до 10 стримов, от новых к старым. Для следующей страницы
        передаётся курсор из последнего элемента. Без курсора возвращается первая
        страница
      parameters:
      - description: Курсор пагинации (base64)
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedStream'
            type: array
        "400":
          description: Неверный курсор
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Лента стримов
      tags:
      - streams
  /social/topics:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Получить список топиков
      tags:
      - posts
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для создания топика
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTopicDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Создать топик
      tags:
      - posts
  /social/topics/{topic_id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID топика
        in: path
        name: topic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Удалить топик
      tags:
      - posts
    get:
      consumes:
      - application/json
      parameters:
      - description: ID топика
        in: path
        name: topic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Topics'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Получить топик по ID
      tags:
      - posts
  /social/topics/{topic_id}/report:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID топика
        in: path
        name: topic_id
        required: true
        type: string
      - description: Данные жалобы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReportTopicDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Пожаловаться на топик
      tags:
      - posts
  /social/upload/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Загружает изображение для публикации. Поддерживаются JPEG, PNG
        и WebP. Максимальный размер — 10 МБ.
      parameters:
      - description: Файл изображения
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: ID загруженного изображения
          schema:
            type: string
        "400":
          description: Некорректный файл или неподдерживаемый формат
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Ошибка загрузки изображения
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Загрузить изображение
      tags:
      - posts
  /social/upload/post:
    post:
      consumes:
      - multipart/form-data
      description: Загружает изображение для публикации. Поддерживаются JPEG, PNG
        и WebP. Максимальный размер — 10 МБ.
      parameters:
      - description: Файл изображения
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: ID загруженного изображения
          schema:
            type: string
        "400":
          description: Некорректный файл или неподдерживаемый формат
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Ошибка загрузки изображения
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Загрузить изображение
      tags:
      - posts
  /social/ws/connect:
    get:
      description: 'Апгрейд соединения до WebSocket. Сервер каждые 30 секунд отправляет
        ping. По сокету приходят JSON-события: для чатов {"id","chat_id","from","text"},
        для стримов {"video_id","from","text"}. Сообщения отправляются отдельными
        HTTP-запросами, по сокету клиент ничего не шлёт. Браузерный WebSocket не умеет
        передавать заголовок Authorization'
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "426":
          description: Не WebSocket-запрос
      security:
      - BearerAuth: []
      summary: Подключиться к WebSocket
      tags:
      - websocket
  /social/ws/message/direct/{chat_id}:
    get:
      consumes:
      - application/json
      description: Сохраняет сообщение и рассылает обоим участникам, подключённым
        по WebSocket. Отправитель должен быть участником чата, а собеседник не должен
        быть в блокировке. Возвращает ID сообщения
      parameters:
      - description: ID личного чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MessageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: ID сообщения
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Не участник чата или блокировка
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Отправить сообщение в личный чат
      tags:
      - messages
  /social/ws/message/group/{chat_id}:
    get:
      consumes:
      - application/json
      description: Сохраняет сообщение и рассылает его участникам, подключённым по
        WebSocket. Отправитель должен быть участником чата и не быть забаненным. Возвращает
        ID сообщения
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MessageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: ID сообщения
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Не участник чата или забанен
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Отправить сообщение в групповой чат
      tags:
      - messages
  /social/ws/message/stream/{video_id}:
    get:
      consumes:
      - application/json
      description: Сохраняет сообщение и рассылает зрителям стрима, подключённым по
        WebSocket. Отправитель должен быть в списке зрителей
      parameters:
      - description: ID видео на YouTube
        in: path
        name: video_id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MessageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Пользователь не в списке зрителей стрима
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Отправить сообщение в чат стрима
      tags:
      - messages
  /social/youtube/callback:
    get:
      description: Проверяет state из cookie, обменивает code на токен, получает ID
        канала пользователя через YouTube API и сохраняет его в профиле. В конце перенаправляет
        на страницу настроек фронтенда
      parameters:
      - description: Значение state, выданное при старте OAuth
        in: query
        name: state
        required: true
        type: string
      - description: Код авторизации Google
        in: query
        name: code
        required: true
        type: string
      responses:
        "303":
          description: Перенаправление на страницу настроек
        "400":
          description: Неверный state, пустой code или у аккаунта нет YouTube-канала
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Не удалось обменять code на токен
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Канал уже привязан к другому пользователю
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "502":
          description: Ошибка запроса к YouTube API
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Завершить подключение YouTube-канала
      tags:
      - youtube
  /social/youtube/channel:
    get:
      consumes:
      - application/json
      description: Возвращает ID YouTube-канала текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: ID канала
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Пользователь не найден или канал не привязан
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Получить привязанный YouTube-канал
      tags:
      - youtube
  /social/youtube/connect:
    get:
      description: Ставит cookie oauth_state на 5 минут и перенаправляет пользователя
        на страницу согласия Google (доступ youtube.readonly)
      responses:
        "307":
          description: Перенаправление на Google OAuth
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Начать подключение YouTube-канала
      tags:
      - youtube
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
