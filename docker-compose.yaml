services:
  auth-service:
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/auth/logs
    build: ./backend/auth-service
    command: ["./auth-main"]
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"

  auth-worker:
    ports:
      - "8082:8082"
    volumes:
      - ./logs:/auth/logs
    build: ./backend/auth-service
    command: ["./auth-worker"]
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy

  
  postgres-auth:
    image: postgres:18
    ports:
    - "5432:5432"
    volumes:
    - postgres_auth_data:/var/lib/postgresql
    env_file:
    -  ./backend/auth-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-auth:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data

  rabbitmq-auth:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
    -  ./backend/auth-service/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  notification-service:
    ports:
      - "8083:8083"
    volumes:
      - ./logs:/auth/logs
    build: ./backend/notification-service
    command: ["./notification-app"]
    env_file:
      - ./backend/notification-service/.env
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
  
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  terraform:
    image: hashicorp/terraform:latest
    working_dir: /workspace
    volumes:
      - ./infra/terraform:/workspace
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c", "terraform init && terraform apply -auto-approve"]

  social-service:
    ports:
      - "8084:8084"
    volumes:
      - ./logs:/auth/logs
    build: ./backend/social-service
    command: ["./social-main"]
    env_file:
      - ./backend/social-service/.env
    depends_on:
      postgres-social:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
    
  postgres-social:
    image: postgres:18
    ports:
      - "5433:5432"
    volumes:
      - postgres_social_data:/var/lib/postgresql
    env_file:
      - ./backend/social-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis-social:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis_social_data:/data
  
  grafana-alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - "./config/config.alloy:/etc/alloy/config.alloy"
      - "./logs:/backend/logs:ro"
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.7.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3200:3000"
    env_file:
      - .env
    depends_on:
      - loki

volumes:
  postgres_auth_data:
  postgres_social_data:
  redis_auth_data:
  redis_social_data:
  rabbitmq_data:
  kafka_data:
  loki-data: