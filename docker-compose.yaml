services:
  auth-service:
    ports:
      - "8081:8081"
    build: ./backend/auth-service
    command: ["./auth-main"]
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy

  auth-worker:
    ports:
      - "8082:8082"
    build: ./backend/auth-service
    command: ["./auth-worker"]
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy

  
  postgres-auth:
    image: postgres:18
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql
    env_file:
    -  ./backend/auth-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-auth:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq-auth:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
    -  ./backend/auth-service/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: